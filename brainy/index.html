<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1210">
<!-- Guardada en la pantalla de inicio del teléfono, se abre como una app: sin barras del navegador -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brainy">
<link rel="manifest" href="manifest.webmanifest">
<meta id="metaDesc" name="description" content="An AI brain built from scratch, in public. Watch Brainy learn: every neuron that lights up is something it already knows.">
<title>Brainy by Huerga Labs</title>
<link rel="canonical" href="https://huergalabs.dev/brainy/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Huerga Labs">
<meta property="og:title" content="Brainy by Huerga Labs">
<meta property="og:description" content="An AI brain built from scratch, in public. Watch it learn: every neuron that lights up is something it already knows.">
<meta property="og:url" content="https://huergalabs.dev/brainy/">
<meta property="og:image" content="https://huergalabs.dev/brainy/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Solo el escenario negro con el cerebro, a pantalla completa. Tipografía y verde de la portada (../index.html). */
:root{
  --stage:#0a1210; --ink:#e7efec; --muted:#9db0a9; --faint:#6f827b; --line:#2a3834; --accent:#3cc6a3;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:var(--stage);color:var(--ink);overflow:hidden}
a:focus-visible,button:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.stage{position:fixed;inset:0;background:var(--stage)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}

/* Lo que va encima del cerebro: no estorba al arrastrar (pointer-events), salvo los enlaces y botones */
.over{position:absolute;pointer-events:none;
  --l:max(20px, env(safe-area-inset-left, 0px)); --r:max(20px, env(safe-area-inset-right, 0px));
  --t:max(18px, env(safe-area-inset-top, 0px)); --b:max(16px, env(safe-area-inset-bottom, 0px))}
.over a,.over button{pointer-events:auto}
.title{left:var(--l);top:var(--t)}
.title h1{margin:0;font:700 clamp(34px, 6vw, 56px)/1 var(--display);letter-spacing:-.02em}
.title small{display:block;margin-top:6px;font:500 13px/1.3 var(--mono);color:var(--accent)}
.pct{margin-top:18px}
.pct b{display:block;font:700 clamp(26px, 4vw, 36px)/1 var(--display);font-variant-numeric:tabular-nums}
.pct span{font:400 13px/1.4 var(--mono);color:var(--muted)}
.back{left:var(--l);bottom:var(--b);font:500 13px/1 var(--mono)}
.back a{color:var(--muted);text-decoration:none}
.back a:hover{color:var(--accent)}
.fs{right:var(--r);top:var(--t)}
.fs button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:10px;
  background:rgba(10,18,16,.6);color:var(--muted);cursor:pointer}
.fs button:hover{color:var(--accent);border-color:var(--accent)}
.fs svg{width:20px;height:20px}
.fs .in{display:none}
.fs button[aria-pressed="true"] .out{display:none}
.fs button[aria-pressed="true"] .in{display:block}
.tip{right:var(--r);bottom:var(--b);font:400 12px/1 var(--mono);color:var(--faint)}
.msg{left:20px;right:20px;bottom:64px;text-align:center;font:400 15px/1.5 system-ui, sans-serif;color:var(--ink)}
@media (max-width: 600px){ .tip{display:none} }
</style>
</head>
<body>

<main class="stage" id="brain">
  <canvas id="brain-canvas" tabindex="0" role="img" aria-label="3D brain: each dot is a neuron and lights up when a milestone is completed."></canvas>

  <div class="over title">
    <h1>Brainy</h1>
    <small data-i18n="by">by Huerga Labs</small>
    <div class="pct"><b data-brain-pct>0 %</b><span data-i18n="learned">learned</span></div>
  </div>
  <div class="over fs">
    <button id="brain-fs" type="button" aria-label="Full screen" aria-pressed="false" hidden>
      <svg class="out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </div>
  <div class="over back"><a href="/" data-i18n="back">← Huerga Labs</a></div>
  <div class="over tip" data-i18n="tip">Drag to rotate · wheel to zoom</div>
  <div class="over msg" id="brain-msg" role="status" hidden></div>
</main>

<noscript><p style="position:fixed;left:20px;right:20px;top:45%;text-align:center;color:#e7efec;font-family:system-ui,sans-serif">Brainy needs JavaScript to draw the brain. / Brainy necesita JavaScript para dibujar el cerebro.</p></noscript>
<script src="brainy.js?v=3" defer></script>
</body>
</html>
